<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0705" />
      <stop offset="35%" stop-color="#1f1105" />
      <stop offset="70%" stop-color="#382109" />
      <stop offset="100%" stop-color="#0a0705" />
    </linearGradient>
    <radialGradient id="glow2" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#f5a623" stop-opacity="0.32" />
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0a0705" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffecb3" />
      <stop offset="50%" stop-color="#ffd54f" />
      <stop offset="100%" stop-color="#ffca28" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#bgGrad2)" />
  <rect width="1920" height="800" fill="url(#glow2)" />

  <!-- Geometric rings -->
  <circle cx="1450" cy="400" r="320" fill="none" stroke="#d4af37" stroke-width="1.2" opacity="0.3" />
  <circle cx="1450" cy="400" r="240" fill="none" stroke="#ffb300" stroke-width="0.8" stroke-dasharray="8,8" opacity="0.25" />

  <!-- Left Content Group -->
  <g transform="translate(140, 150)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="370" height="42" rx="21" fill="#2b1704" stroke="#ffb300" stroke-width="1" opacity="0.9" />
    <circle cx="24" cy="21" r="5" fill="#ffb300" />
    <text x="44" y="27" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#ffecb3" letter-spacing="3">MAISON ROVEN • PRIVATE RESERVE</text>

    <!-- Main Title -->
    <text x="0" y="130" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="1">
      Aged Assam Oud
    </text>
    <text x="0" y="200" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="url(#goldText2)" letter-spacing="0.5">
      &amp; Golden Amber Resins
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="270" font-family="'Cairo', sans-serif" font-size="22" font-weight="400" fill="#EDEBDD" opacity="0.88">
      سيمفونية شرقية مهيبة من دهن العود الآسامي المعتق، بلورات العنبر الذهبي، ودموع اللبان الحوجري.
    </text>
    <text x="0" y="305" font-family="'Cairo', sans-serif" font-size="20" font-weight="400" fill="#EDEBDD" opacity="0.75">
      بصمة عطرية تدوم وتلفت الأنظار في أرقى المناسبات مع تغليف إهداء فاخر.
    </text>

    <!-- Specs Pills -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="190" height="38" rx="19" fill="#1B1717" stroke="#ffb300" stroke-width="1" opacity="0.7" />
      <text x="95" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#ffecb3" text-anchor="middle">عود آسامي معتق</text>

      <rect x="210" y="0" width="180" height="38" rx="19" fill="#1B1717" stroke="#ffb300" stroke-width="1" opacity="0.7" />
      <text x="300" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#ffecb3" text-anchor="middle">عنبر ولبان ملكي</text>

      <rect x="410" y="0" width="190" height="38" rx="19" fill="#1B1717" stroke="#ffb300" stroke-width="1" opacity="0.7" />
      <text x="505" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#ffecb3" text-anchor="middle">توصيل سريع 24H</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="280" height="58" rx="29" fill="#b26a00" stroke="#ffd54f" stroke-width="1.5" />
      <text x="120" y="36" font-family="'Cinzel', 'Playfair Display', sans-serif" font-size="16" font-weight="700" fill="#ffffff" letter-spacing="2">SHOP OUD RESERVE</text>
      <circle cx="245" cy="29" r="15" fill="#5c3800" />
      <path d="M 241 24 L 247 29 L 241 34" fill="none" stroke="#ffecb3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Right Visual Flacon Silhouette Artwork -->
  <g transform="translate(1300, 160)">
    <rect x="40" y="50" width="220" height="360" rx="24" fill="#000000" opacity="0.5" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))" />
    <rect x="45" y="100" width="210" height="320" rx="20" fill="#1c1103" stroke="#ffd54f" stroke-width="2" />
    <rect x="55" y="140" width="190" height="260" rx="14" fill="#3a2202" opacity="0.85" />
    <path d="M 55 230 Q 150 215 245 230 L 245 400 L 55 400 Z" fill="#804d00" opacity="0.9" />
    <rect x="115" y="30" width="70" height="70" rx="8" fill="#0d0801" stroke="#ffd54f" stroke-width="2" />
    <rect x="135" y="15" width="30" height="15" fill="#ffd54f" />
    <circle cx="150" cy="280" r="34" fill="#0d0801" stroke="#ffd54f" stroke-width="1.5" />
    <text x="150" y="287" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#ffd54f" text-anchor="middle">R</text>
    <text x="150" y="335" font-family="'Cinzel', sans-serif" font-size="11" font-weight="700" fill="#ffecb3" text-anchor="middle" letter-spacing="3">ROYAL AMBER</text>
    <text x="150" y="352" font-family="'Cinzel', sans-serif" font-size="9" fill="#ffd54f" text-anchor="middle" letter-spacing="1">AGED ASSAM OUD</text>
  </g>
</svg>

