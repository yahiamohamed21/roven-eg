<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 800" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140808" />
      <stop offset="45%" stop-color="#3d0303" />
      <stop offset="75%" stop-color="#630000" />
      <stop offset="100%" stop-color="#140808" />
    </linearGradient>
    <radialGradient id="glow1" cx="75%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#e8c688" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#810100" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#140808" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fdf4dc" />
      <stop offset="50%" stop-color="#dfb15b" />
      <stop offset="100%" stop-color="#f5e0aa" />
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#810100" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0.8" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1920" height="800" fill="url(#bgGrad1)" />
  <rect width="1920" height="800" fill="url(#glow1)" />

  <!-- Subtle luxury geometric line accents -->
  <circle cx="1450" cy="400" r="320" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" opacity="0.35" />
  <circle cx="1450" cy="400" r="260" fill="none" stroke="#e8c688" stroke-width="0.8" stroke-dasharray="6,6" opacity="0.25" />
  <circle cx="1450" cy="400" r="380" fill="none" stroke="#dfb15b" stroke-width="0.5" opacity="0.15" />

  <!-- Left Content Group -->
  <g transform="translate(140, 150)">
    <!-- Eyebrow Badge -->
    <rect x="0" y="0" width="340" height="42" rx="21" fill="#630000" stroke="#dfb15b" stroke-width="1" opacity="0.85" />
    <circle cx="24" cy="21" r="5" fill="#dfb15b" />
    <text x="44" y="27" font-family="'Cinzel', 'Playfair Display', Georgia, serif" font-size="14" font-weight="700" fill="#fdf4dc" letter-spacing="3">MAISON ROVEN • PARIS</text>

    <!-- Main Title -->
    <text x="0" y="130" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="900" fill="#fdf4dc" letter-spacing="1">
      L'Art de l'Extrait
    </text>
    <text x="0" y="200" font-family="'Playfair Display', Georgia, serif" font-size="52" font-weight="700" fill="url(#goldText)" letter-spacing="0.5">
      30% Pure Oil Concentration
    </text>

    <!-- Subtitle / Description -->
    <text x="0" y="270" font-family="'Cairo', sans-serif" font-size="22" font-weight="400" fill="#EDEBDD" opacity="0.88">
      إصدار الروچ ڤيلور الفاخر بتوليفة نادرة من الورد الدمشقي والكرز الأسود والعنبر الطبيعي.
    </text>
    <text x="0" y="305" font-family="'Cairo', sans-serif" font-size="20" font-weight="400" fill="#EDEBDD" opacity="0.75">
      ثبات يتخطى 24 ساعة مع شحن مجاني لكافة المحافظات وإمكانية المعاينة قبل الاستلام.
    </text>

    <!-- Specs Pills -->
    <g transform="translate(0, 360)">
      <rect x="0" y="0" width="180" height="38" rx="19" fill="#1B1717" stroke="#e8c688" stroke-width="1" opacity="0.7" />
      <text x="90" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#fdf4dc" text-anchor="middle">تركيز 30% إكستري</text>

      <rect x="200" y="0" width="180" height="38" rx="19" fill="#1B1717" stroke="#e8c688" stroke-width="1" opacity="0.7" />
      <text x="290" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#fdf4dc" text-anchor="middle">ثبات وفوحان 24H+</text>

      <rect x="400" y="0" width="190" height="38" rx="19" fill="#1B1717" stroke="#e8c688" stroke-width="1" opacity="0.7" />
      <text x="495" y="24" font-family="'Cairo', sans-serif" font-size="14" font-weight="600" fill="#fdf4dc" text-anchor="middle">معاينة COD قبل الدفع</text>
    </g>

    <!-- CTA Button -->
    <g transform="translate(0, 440)">
      <rect x="0" y="0" width="260" height="58" rx="29" fill="#810100" stroke="#dfb15b" stroke-width="1.5" />
      <text x="110" y="36" font-family="'Cinzel', 'Playfair Display', sans-serif" font-size="16" font-weight="700" fill="#EDEBDD" letter-spacing="2">SHOP EXTRAIT</text>
      <circle cx="225" cy="29" r="15" fill="#630000" />
      <path d="M 221 24 L 227 29 L 221 34" fill="none" stroke="#fdf4dc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Right Visual Flacon Silhouette Artwork -->
  <g transform="translate(1300, 160)">
    <!-- Flacon Outer Shadow Plate -->
    <rect x="40" y="50" width="220" height="360" rx="24" fill="#000000" opacity="0.45" filter="drop-shadow(0 20px 40px rgba(0,0,0,0.8))" />
    <!-- Flacon Body -->
    <rect x="45" y="100" width="210" height="320" rx="20" fill="#2b0202" stroke="#dfb15b" stroke-width="2" />
    <!-- Golden Liquid Level -->
    <rect x="55" y="140" width="190" height="260" rx="14" fill="#630000" opacity="0.85" />
    <path d="M 55 220 Q 150 205 245 220 L 245 400 L 55 400 Z" fill="#810100" opacity="0.9" />
    <!-- Cap -->
    <rect x="115" y="30" width="70" height="70" rx="8" fill="#140808" stroke="#dfb15b" stroke-width="2" />
    <rect x="135" y="15" width="30" height="15" fill="#dfb15b" />
    <!-- Crest on Bottle -->
    <circle cx="150" cy="280" r="34" fill="#140808" stroke="#dfb15b" stroke-width="1.5" />
    <text x="150" y="287" font-family="'Playfair Display', serif" font-size="20" font-weight="900" fill="#dfb15b" text-anchor="middle">R</text>
    <text x="150" y="335" font-family="'Cinzel', sans-serif" font-size="11" font-weight="700" fill="#fdf4dc" text-anchor="middle" letter-spacing="3">ROUGE VELOURS</text>
    <text x="150" y="352" font-family="'Cinzel', sans-serif" font-size="9" fill="#dfb15b" text-anchor="middle" letter-spacing="1">EXTRAIT DE PARFUM</text>
  </g>
</svg>

