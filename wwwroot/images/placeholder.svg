<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#F3ECE2"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFB15B"/>
      <stop offset="100%" stop-color="#B8860B"/>
    </linearGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bgGrad)" rx="16"/>
  <rect x="20" y="20" width="360" height="360" fill="none" stroke="#DFB15B" stroke-width="1.5" stroke-dasharray="6,4" rx="12" opacity="0.6"/>
  <g transform="translate(200, 175)" text-anchor="middle">
    <!-- Flacon Cap -->
    <rect x="-14" y="-70" width="28" height="22" rx="3" fill="url(#goldGrad)"/>
    <rect x="-7" y="-48" width="14" height="8" fill="#810100"/>
    <!-- Flacon Shoulder -->
    <path d="M -30,-40 L 30,-40 L 48,-15 L 48,50 C 48,58 42,64 34,64 L -34,64 C -42,64 -48,58 -48,50 L -48,-15 Z" fill="none" stroke="#810100" stroke-width="3"/>
    <!-- Emblem -->
    <circle cx="0" cy="8" r="16" fill="none" stroke="#DFB15B" stroke-width="1.5"/>
    <text x="0" y="14" font-family="'Cinzel', serif, 'Times New Roman'" font-size="16" font-weight="700" fill="#810100">R</text>
  </g>
  <text x="200" y="275" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#810100" text-anchor="middle" letter-spacing="1">MAISON ROVEN</text>
  <text x="200" y="295" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#7A6B58" text-anchor="middle">Image Placeholder</text>
