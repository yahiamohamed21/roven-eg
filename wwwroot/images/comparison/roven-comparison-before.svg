<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <linearGradient id="bgBefore" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5F3EF" />
      <stop offset="100%" stop-color="#E7E4DC" />
    </linearGradient>
    <filter id="shadowBefore" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="600" fill="url(#bgBefore)" />

  <!-- Subtle grid / pattern -->
  <circle cx="750" cy="300" r="240" fill="#dedbd2" opacity="0.4" />
  <circle cx="750" cy="300" r="170" fill="#d3cfc4" opacity="0.3" />

  <!-- Ghost Bottle Silhouette in background -->
  <g opacity="0.25" transform="translate(620, 140)">
    <!-- Cap -->
    <rect x="75" y="0" width="50" height="40" rx="4" fill="#666" />
    <rect x="85" y="40" width="30" height="15" fill="#888" />
    <!-- Bottle -->
    <rect x="25" y="55" width="150" height="230" rx="16" fill="#888" stroke="#555" stroke-width="3" />
    <!-- Liquid line (low) -->
    <rect x="30" y="200" width="140" height="80" rx="10" fill="#aaa" opacity="0.5" />
    <text x="100" y="160" text-anchor="middle" font-family="'Cinzel', serif" font-size="14" font-weight="700" fill="#444" letter-spacing="2">GENERIC</text>
    <text x="100" y="180" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="10" fill="#666">Eau de Toilette</text>
  </g>

  <!-- Header watermark -->
  <g transform="translate(60, 60)">
    <rect x="0" y="0" width="130" height="32" rx="16" fill="#DC2626" opacity="0.12" />
    <text x="65" y="21" text-anchor="middle" font-family="'Cinzel', 'Playfair Display', serif" font-size="13" font-weight="800" fill="#DC2626" letter-spacing="1.5">BEFORE / THEM</text>
  </g>

  <!-- Comparison Points List -->
  <g transform="translate(60, 125)">
    <!-- Point 1 -->
    <g transform="translate(0, 0)" filter="url(#shadowBefore)">
      <rect width="480" height="82" rx="14" fill="#FFFFFF" stroke="#F0ECE3" stroke-width="1.5" />
      <circle cx="44" cy="41" r="22" fill="#FEE2E2" />
      <!-- Hourglass icon -->
      <path d="M38 31 H50 M38 51 H50 M39 31 C39 41 49 41 49 51 M49 31 C49 41 39 41 39 51" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <text x="82" y="34" font-family="'Playfair Display', 'Cinzel', serif" font-size="16" font-weight="800" fill="#1B1717" letter-spacing="0.5">DOESN'T LAST</text>
      <text x="82" y="56" font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="500" fill="#6B7280">Fades quickly after the first 30–45 minutes</text>
    </g>

    <!-- Point 2 -->
    <g transform="translate(0, 100)" filter="url(#shadowBefore)">
      <rect width="480" height="82" rx="14" fill="#FFFFFF" stroke="#F0ECE3" stroke-width="1.5" />
      <circle cx="44" cy="41" r="22" fill="#FEE2E2" />
      <!-- Broken chain / weak icon -->
      <path d="M36 41 H40 M48 41 H52 M37 36 C34 39 34 43 37 46 M51 36 C54 39 54 43 51 46" stroke="#DC2626" stroke-width="2.2" stroke-linecap="round" fill="none" />
      <text x="82" y="34" font-family="'Playfair Display', 'Cinzel', serif" font-size="16" font-weight="800" fill="#1B1717" letter-spacing="0.5">WEAK SCENT &amp; SILLAGE</text>
      <text x="82" y="56" font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="500" fill="#6B7280">Diluted oil formula (under 10%) with synthetic alcohol</text>
    </g>

    <!-- Point 3 -->
    <g transform="translate(0, 200)" filter="url(#shadowBefore)">
      <rect width="480" height="82" rx="14" fill="#FFFFFF" stroke="#F0ECE3" stroke-width="1.5" />
      <circle cx="44" cy="41" r="22" fill="#FEE2E2" />
      <!-- Stain drop icon -->
      <path d="M44 32 C44 32 37 41 37 45 C37 49 40 52 44 52 C48 52 51 49 51 45 C51 41 44 32 44 32 Z" stroke="#DC2626" stroke-width="2.2" stroke-linejoin="round" fill="none" />
      <text x="82" y="34" font-family="'Playfair Display', 'Cinzel', serif" font-size="16" font-weight="800" fill="#1B1717" letter-spacing="0.5">STAINS CLOTHES</text>
      <text x="82" y="56" font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="500" fill="#6B7280">Leaves oily yellowish marks on white shirts and fabrics</text>
    </g>

    <!-- Point 4 -->
    <g transform="translate(0, 300)" filter="url(#shadowBefore)">
      <rect width="480" height="82" rx="14" fill="#FFFFFF" stroke="#F0ECE3" stroke-width="1.5" />
      <circle cx="44" cy="41" r="22" fill="#FEE2E2" />
      <!-- No guarantee icon -->
      <circle cx="44" cy="41" r="9" stroke="#DC2626" stroke-width="2.2" fill="none" />
      <line x1="38" y1="35" x2="50" y2="47" stroke="#DC2626" stroke-width="2.2" />
      <text x="82" y="34" font-family="'Playfair Display', 'Cinzel', serif" font-size="16" font-weight="800" fill="#1B1717" letter-spacing="0.5">NO INSPECTION GUARANTEE</text>
      <text x="82" y="56" font-family="'Montserrat', sans-serif" font-size="12.5" font-weight="500" fill="#6B7280">Non-refundable upon delivery, zero quality inspection</text>
    </g>
  </g>
</svg>