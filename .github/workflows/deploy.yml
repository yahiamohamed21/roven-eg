name: Production Deployment

on:
  push:
    branches:
      - main
      - Production
  workflow_dispatch:

concurrency:
  group: production_deployment
  cancel-in-progress: false

jobs:
  build-and-verify:
    name: Build & Verify Application
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore Dependencies
        run: dotnet restore Stockify.csproj

      - name: Build Application (Release)
        run: dotnet build Stockify.csproj -c Release --no-restore

  deploy:
    name: Deploy to Production VPS
    needs: build-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Remote Deploy Script via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            cd /var/www/roven-eg.online
            chmod +x scripts/deploy.sh
            sudo ./scripts/deploy.sh "${{ github.ref_name }}" || ./scripts/deploy.sh "${{ github.ref_name }}"
